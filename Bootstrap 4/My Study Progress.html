<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Step 1: Title, character set, and viewport meta tags -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Learning Dashboard</title>

    <!-- Step 2: Bootstrap 4 CSS Link (supports jumbotron, btn, badge, and progress) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Step 3: Page styling -->
    <style>
        body {
            background-color: #f4f7f6;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .jumbotron {
            background-color: #2c3e50;
            color: #ffffff;
            padding: 2rem;
            border-radius: 10px;
            margin-bottom: 30px;
        }

        .jumbotron h1 {
            font-size: 2.5rem;
            font-weight: bold;
        }

        .section-title {
            color: #2c3e50;
            margin-top: 25px;
            margin-bottom: 15px;
            font-weight: bold;
        }

        p {
            font-size: 1.1rem;
            margin-bottom: 8px;
        }
    </style>
</head>

<body>

    <div class="container">
        <!-- Step 4: Jumbotron and buttons -->
        <div class="jumbotron">
            <h1>Student Learning Dashboard</h1>
            <p>Track your daily subjects, completed lessons, and overall course progress.</p>
            <button type="button" class="btn btn-primary mr-2 mb-2">Math</button>
            <button type="button" class="btn btn-warning mr-2 mb-2">Science</button>
            <button type="button" class="btn btn-dark mr-2 mb-2">English</button>
            <button type="button" class="btn btn-info mb-2">Coding</button>
        </div>

        <!-- Step 5: Badges for completed lessons -->
        <h2 class="section-title">
            Lessons Completed <span class="badge badge-dark">24</span>
        </h2>
        <div class="mb-4">
            <p>Math <span class="badge badge-primary">8</span></p>
            <p>Science <span class="badge badge-warning">6</span></p>
            <p>English <span class="badge badge-dark">5</span></p>
            <p>Coding <span class="badge badge-info">4</span></p>
        </div>

        <!-- Step 6: Progress bars -->
        <h2 class="section-title">Subject Progress</h2>

        <p>Math</p>
        <div class="progress mb-3">
        <div class="progress-bar bg-primary" style="width: 80%">80%</div>
        </div>

        <p>Science</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-warning" style="width: 60%">60%</div>
        </div>

        <p>English</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-dark" style="width: 50%">50%</div>
        </div>

        <p>Coding</p>
        <div class="progress mb-3">
            <div class="progress-bar bg-info" style="width: 75%">75%</div>
        </div>
    </div>

</body>

</html>
