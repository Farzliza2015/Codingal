<!DOCTYPE html>
<html>
    <head>
        <title>My Hobby Cards</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" 
        
        href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: Times New Roman, serif;
            padding: 30px 15px;
        }
        h1 {
            text-align: center;
            color: #FF5A43;
        }
        .hobby-card {
            text-align: center;
            border: 2px solid #FF5A43;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
            background-color: #fff8e1;
        }
        .hobby-card h3 {
            color: #FF5A43;
        }
    </style>
    </head>
    <body>

        <h1>My Hobby Cards</h1>
        <div class="container">
        <div class="row">
        <div class="col-12 col-md-6 col-lg-4">
        <div class="hobby-card">
                <h3>Photography</h3>
                <p>I love capturing moments and creating memories through my lens.</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Cooking</h3>
                <p>Experimenting with new recipes and flavors is my passion.</p>
            </div>
        </div>
        <div class="col-12 col-md-6 col-lg-4">
            <div class="hobby-card">
                <h3>Traveling</h3>
                <p>Exploring new places and cultures is an adventure I cherish.</p>
            </div>
            </div>
       
        </div>
        </div>
    </body>
</html>
